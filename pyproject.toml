[project]
name = "voxout"
version = "0.1.0"
description = "VoxCPM2 对外内容语音输出：48kHz 渲染 + 音色锚点 + 两道自动闸门"
requires-python = ">=3.12"
dependencies = [
    "mlx-audio[tts,stt]>=0.4.8",
    "cn2an>=0.5.24",
    "opencc-python-reimplemented>=0.1.7",
    "numpy>=2.0",
    "scipy>=1.18",
]

[project.scripts]
voxout = "voxout.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxout"]

# transformers 5.15.0 是 mlx-audio 的硬依赖，走预发布通道。
[tool.uv]
prerelease = "allow"

# 设计 §4 坑 1：默认走 files.pythonhosted.org 在本机网络下静默挂死（实测 29 分钟零进展）。
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: 碰模型，慢。快速回路用 uv run pytest -m 'not integration'",
]
